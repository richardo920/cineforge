[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "cineforge"
version = "0.1.0"
description = "Modular AI filmmaking platform foundation"
readme = "README.md"
requires-python = ">=3.11"
license = "LicenseRef-Proprietary"
dependencies = []

[project.scripts]
cineforge = "cineforge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "scripts/ci_guard.py", "scripts/check_guard_fixtures.py", "scripts/agent_evidence.py", "scripts/protection_probe.py", "scripts/test_tiers.py"]
