name: Scheduled dependency audit
on:
  schedule:
    - cron: '23 8 * * *'
permissions:
  contents: read
  issues: write
concurrency:
  group: scheduled-dependency-audit
  cancel-in-progress: false
jobs:
  audit:
    name: Daily full dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.14'
      - run: python -m pip install -r requirements-ci.txt
      - run: python scripts/ci_guard.py dependencies
      - name: Audit installed environment
        if: ${{ !cancelled() }}
        run: python -m pip_audit --strict
      # Full manifest review replaces commit-diff dependency-review on scheduled runs.
      # Include runtime/build declarations and CI pins, with transitive resolution.
      - name: Review all declared dependencies
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          python - <<'PY'
          import os
          import pathlib
          import tomllib

          project = tomllib.loads(pathlib.Path('pyproject.toml').read_text())
          requirements = pathlib.Path('requirements-ci.txt').read_text()
          declared = project['project']['dependencies'] + project['build-system']['requires']
          target = pathlib.Path(os.environ['RUNNER_TEMP']) / 'full-dependency-audit.txt'
          target.write_text(requirements + '\n' + '\n'.join(declared) + '\n')
          PY
          python -m pip_audit --strict -r "$RUNNER_TEMP/full-dependency-audit.txt"
      - name: Open issue on audit failure
        if: ${{ failure() }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          # List directly (not search indexing); serialize runs and match a stable marker.
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/issues?state=open&per_page=100" > "$RUNNER_TEMP/open-issues.json"
          python - <<'PY'
          import json
          import os
          import pathlib
          import subprocess

          marker = '<!-- cineforge:scheduled-dependency-audit-failure -->'
          pages = json.loads((pathlib.Path(os.environ['RUNNER_TEMP']) / 'open-issues.json').read_text())
          if not any(marker in (issue.get('body') or '')
                     for page in pages for issue in page if 'pull_request' not in issue):
              run = (f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}"
                     f"/actions/runs/{os.environ['GITHUB_RUN_ID']}")
              subprocess.run([
                  'gh', 'issue', 'create', '--repo', os.environ['GITHUB_REPOSITORY'],
                  '--title', 'Scheduled dependency audit failed',
                  '--body', f'{marker}\nDaily full audit failed: {run}\n'
                  'Inspect both audit logs for vulnerabilities or advisory-service errors.',
              ], check=True)
          PY
