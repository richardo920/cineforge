name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install pip==26.2.2 build==1.3.0 setuptools==84.2.1 wheel==0.48.0
      - run: python -m build --no-isolation
      - run: python -m pip install --no-deps --no-build-isolation dist/*.tar.gz
      - run: python -m pip install --no-deps --force-reinstall dist/*.whl
      - run: python scripts/test_tiers.py --tier offline --tier contract
      - run: cineforge --version
  quality:
    name: Quality guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.14'
      - run: python -m pip install -r requirements-ci.txt
      - run: python -m ruff check .
      - run: python -m mypy
      - run: python scripts/ci_guard.py artifacts
      - run: python scripts/ci_guard.py dependencies
      - run: python scripts/ci_guard.py secrets
      - run: python scripts/check_guard_fixtures.py
  dependencies:
    name: Dependency review
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.14'
      - run: python -m pip install -r requirements-ci.txt
      - run: python scripts/ci_guard.py dependencies
      # Network advisory lookup is distinct from offline test execution; errors fail closed.
      - run: python -m pip_audit --strict
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        if: github.event_name == 'pull_request'
        with:
          fail-on-severity: low
          comment-summary-in-pr: never
